<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="screenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c14"/>
    </linearGradient>
    <radialGradient id="phosphorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Oscilloscope Chassis / Casing -->
  <rect width="1200" height="675" fill="#0f172a"/>
  
  <!-- CRT Screen Outer Rim -->
  <rect x="50" y="40" width="1100" height="500" rx="30" fill="#021c14" stroke="#334155" stroke-width="8"/>
  <rect x="70" y="60" width="1060" height="460" rx="20" fill="url(#screenBg)"/>
  <rect x="70" y="60" width="1060" height="460" rx="20" fill="url(#phosphorGlow)"/>

  <!-- Oscilloscope Coordinate Grid (Subtle green lines) -->
  <g stroke="#10b981" stroke-width="0.8" opacity="0.25">
    <!-- Vertical divisions -->
    <line x1="160" y1="60" x2="160" y2="520"/><line x1="260" y1="60" x2="260" y2="520"/>
    <line x1="360" y1="60" x2="360" y2="520"/><line x1="460" y1="60" x2="460" y2="520"/>
    <line x1="560" y1="60" x2="560" y2="520"/><line x1="660" y1="60" x2="660" y2="520"/>
    <line x1="760" y1="60" x2="760" y2="520"/><line x1="860" y1="60" x2="860" y2="520"/>
    <line x1="960" y1="60" x2="960" y2="520"/><line x1="1060" y1="60" x2="1060" y2="520"/>
    <!-- Horizontal divisions -->
    <line x1="70" y1="120" x2="1130" y2="120"/><line x1="70" y1="180" x2="1130" y2="180"/>
    <line x1="70" y1="240" x2="1130" y2="240"/><line x1="70" y1="340" x2="1130" y2="340"/>
    <line x1="70" y1="400" x2="1130" y2="400"/><line x1="70" y1="460" x2="1130" y2="460"/>
  </g>
  <!-- Primary Center Axes -->
  <line x1="70" y1="290" x2="1130" y2="290" stroke="#34d399" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="60" x2="600" y2="520" stroke="#34d399" stroke-width="2" opacity="0.6"/>

  <!-- Waveform 1: Cyan High Frequency Sine Wave -->
  <!-- y = 60 * sin(3x) -->
  <path d="M 70 290 
           Q 95 180, 120 290 T 170 290 T 220 290 T 270 290 T 320 290 T 370 290 T 420 290 T 470 290 T 520 290 T 570 290 T 620 290 T 670 290 T 720 290 T 770 290 T 820 290 T 870 290 T 920 290 T 970 290 T 1020 290 T 1070 290 T 1120 290"
        fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75"/>

  <!-- Waveform 2: Soft Coral Fundamental Frequency -->
  <!-- y = 100 * sin(x) -->
  <path d="M 70 290 
           Q 200 130, 330 290 T 590 290 T 850 290 T 1110 290"
        fill="none" stroke="#fb7185" stroke-width="3" opacity="0.75"/>

  <!-- Resulting Composite Superposition Harmonic Wave (Emerald Neon Glow) -->
  <path d="M 70 290 
           C 120 120, 150 170, 200 230 
           C 250 290, 280 130, 330 290 
           C 380 430, 420 380, 460 450 
           C 510 500, 550 380, 600 290 
           C 650 120, 680 170, 730 230 
           C 780 290, 810 130, 860 290 
           C 910 430, 950 380, 990 450 
           C 1040 500, 1080 380, 1130 290"
        fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" filter="url(#neonGreen)"/>

  <!-- Channel Legends on Screen -->
  <g transform="translate(100, 90)">
    <circle cx="10" cy="10" r="6" fill="#38bdf8"/>
    <text x="26" y="15" fill="#38bdf8" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">CH1: sin(A) Carrier</text>
    <circle cx="210" cy="10" r="6" fill="#fb7185"/>
    <text x="226" y="15" fill="#fb7185" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">CH2: sin(B) Modulator</text>
    <circle cx="430" cy="10" r="6" fill="#10b981" filter="url(#neonGreen)"/>
    <text x="446" y="15" fill="#34d399" font-family="'Outfit', sans-serif" font-size="14" font-weight="900">HARMONIC COMPOSITE WAVE</text>
  </g>

  <!-- Lower Instrument Control Panel -->
  <g transform="translate(50, 560)">
    <!-- Controls Bar -->
    <rect width="1100" height="95" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Rotary Dial 1 -->
    <circle cx="90" cy="48" r="26" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <line x1="90" y1="48" x2="105" y2="30" stroke="#38bdf8" stroke-width="4"/>
    <text x="90" y="86" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" text-anchor="middle">FREQ A</text>

    <!-- Rotary Dial 2 -->
    <circle cx="180" cy="48" r="26" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <line x1="180" y1="48" x2="165" y2="30" stroke="#fb7185" stroke-width="4"/>
    <text x="180" y="86" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" text-anchor="middle">FREQ B</text>

    <!-- Formula Display in Center -->
    <rect x="250" y="15" width="600" height="65" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="550" y="38" fill="#a7f3d0" font-family="'Outfit', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      COMPOUND ANGLE SUM HARMONICS IN ACOUSTICS &amp; WIRELESS SIGNALS
    </text>
    <text x="550" y="64" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
      sin(A ± B) = sin A cos B ± cos A sin B
    </text>

    <!-- Power & Status lights -->
    <circle cx="910" cy="48" r="8" fill="#10b981" filter="url(#neonGreen)"/>
    <text x="926" y="53" fill="#10b981" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">SYNTH LOCK</text>
    <circle cx="1020" cy="48" r="8" fill="#f59e0b"/>
    <text x="1036" y="53" fill="#f59e0b" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold">LIVE 44.1kHz</text>
  </g>
</svg>
